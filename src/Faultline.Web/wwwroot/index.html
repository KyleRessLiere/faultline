<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLUCK</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Blazor CSS isolation bundle: lets a component own its styles in Component.razor.css
         instead of everything piling into app.css. -->
    <link rel="stylesheet" href="Faultline.Web.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">Loading PLUCK…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- File saving and localStorage for custom scenarios. Plain script, loaded before Blazor so
         window.faultlineFiles exists by the time any component calls into it. -->
    <script src="js/fightfiles.js"></script>
    <!-- One media query, read once by the board animator. -->
    <script src="js/motion.js"></script>
    <!-- Posts this sitting's log to whichever local host is serving the game. Silent when none is. -->
    <script src="js/playtestlog.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
